services:

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    # Bind to localhost only — loader connects via 127.0.0.1:5432 on the host.
    # Never expose postgres to the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    restart: always
    env_file: .env
    environment:
      MB_DB_TYPE: ${METABASE_DB_TYPE}
      MB_DB_HOST: ${METABASE_DB_HOST}
      MB_DB_PORT: ${METABASE_DB_PORT}
      MB_DB_DBNAME: ${METABASE_DB_DBNAME}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASS}
      MB_SITE_URL: http://${SERVER_IP}
      MB_ANON_TRACKING_ENABLED: "false"
    ports:
      # Exposed directly on port 80 until a domain + Caddy are added.
      # To add TLS later: remove this port binding, uncomment the caddy service below.
      - "80:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # caddy:   <- uncomment when you have a domain
  #   image: caddy:2-alpine
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - internal
  #   depends_on:
  #     - metabase

volumes:
  postgres_data:
  # caddy_data:    <- uncomment with caddy
  # caddy_config:  <- uncomment with caddy

networks:
  internal:
    driver: bridge
